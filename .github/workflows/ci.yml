name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Permite relanzar el despliegue a mano desde la pestaña Actions (solo sobre main).
  workflow_dispatch:

jobs:
  # Trabajo obligatorio del enunciado: runner de GitHub (ubuntu-latest).
  tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: clave-solo-para-ci-nunca-la-real-0123456789     # de pruebas (mín. 32)
      DATABASE_URL: sqlite:///./test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar tests con cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  # Extra: construye la imagen Docker y comprueba que la API arranca,
  # en el runner propio del homelab. Solo corre si la variable de la
  # organizacion HOMELAB_RUNNER vale "true"; si el runner se apaga,
  # se cambia a "false" y el trabajo se salta (el CI sigue en verde).
  docker:
    needs: tests
    if: vars.HOMELAB_RUNNER == 'true'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 15
    env:
      IMAGEN: pokedex-api:ci-${{ github.run_id }}
      CONTENEDOR: pokedex-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t "$IMAGEN" .
      - name: Arrancar la API en un contenedor
        run: |
          docker run -d --name "$CONTENEDOR" \
            -e SECRET_KEY=clave-solo-para-ci-nunca-la-real-0123456789 \
            -e DATABASE_URL=sqlite:///./ci.db \
            -p 127.0.0.1::8000 "$IMAGEN"
      - name: Comprobar /health y /docs
        run: |
          PUERTO=$(docker port "$CONTENEDOR" 8000/tcp | head -1 | cut -d: -f2)
          for i in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:$PUERTO/health" && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$PUERTO/health"
          curl -fsS -o /dev/null "http://127.0.0.1:$PUERTO/docs"
          echo "API arrancada y respondiendo en Docker"
      - name: Logs del contenedor si algo falla
        if: failure()
        run: docker logs "$CONTENEDOR" || true
      - name: Limpiar
        if: always()
        run: |
          docker rm -f "$CONTENEDOR" || true
          docker rmi "$IMAGEN" || true

  # Despliegue continuo en el homelab: solo cuando cambia main y después de los
  # tests. Se activa con la variable del repo HOMELAB_DEPLOY=true. La clave real
  # está en el secreto HOMELAB_SECRET_KEY, nunca en el código.
  deploy-homelab:
    needs: tests
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.HOMELAB_DEPLOY == 'true'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 15
    concurrency:
      group: deploy-homelab
      cancel-in-progress: false
    env:
      DOCKER_BUILDKIT: "1"
      IMAGEN: pokedex-api:prod
      CONTENEDOR: pokedex-api
      PUERTO: "8000"
      URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t "$IMAGEN" .
      - name: Sustituir el contenedor en marcha
        env:
          SECRET_KEY: ${{ secrets.HOMELAB_SECRET_KEY }}
        run: |
          test -n "$SECRET_KEY" || { echo "Falta el secreto HOMELAB_SECRET_KEY"; exit 1; }
          docker rm -f "$CONTENEDOR" 2>/dev/null || true
          # Los datos (BD y log) viven en un volumen: sobreviven a cada despliegue.
          docker run -d --name "$CONTENEDOR" --restart unless-stopped \
            -p "$PUERTO:8000" \
            -e SECRET_KEY \
            -e DATABASE_URL=sqlite:////srv/api/data/pokedex.db \
            -e LOG_FILE=/srv/api/data/pokedex_api.log \
            -v pokedex-data:/srv/api/data \
            "$IMAGEN"
      - name: Esperar a que arranque
        run: |
          for i in $(seq 1 30); do curl -fsS "$URL/health" && break; sleep 1; done
          curl -fsS "$URL/health"
          curl -fsS -o /dev/null "$URL/docs"
      - name: Probar la API desplegada (con la PokeAPI real)
        env:
          CLAVE: ${{ secrets.HOMELAB_SMOKE_PASSWORD }}
        run: |
          set -e
          USUARIO=ci-smoke
          # Registro (201 la primera vez, 409 si ya existe: los dos valen).
          codigo=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/v1/auth/register" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$USUARIO\",\"email\":\"$USUARIO@npcs-group.dev\",\"password\":\"$CLAVE\"}")
          echo "registro: $codigo"; [ "$codigo" = 201 ] || [ "$codigo" = 409 ]
          TOKEN=$(curl -fsS -X POST "$URL/api/v1/auth/login" \
            --data-urlencode "username=$USUARIO" --data-urlencode "password=$CLAVE" | jq -r .access_token)
          AUTH="Authorization: Bearer $TOKEN"
          curl -fsS "$URL/api/v1/auth/me" -H "$AUTH" | jq -e '.username == "ci-smoke"' >/dev/null
          curl -fsS "$URL/api/v1/pokemon/pikachu" -H "$AUTH" | jq -e '.id == 25' >/dev/null
          curl -fsS "$URL/api/v1/pokemon/search?q=saur" -H "$AUTH" | jq -e '.count > 0' >/dev/null
          curl -fsS "$URL/api/v1/pokemon/charizard/card" -H "$AUTH" -o /tmp/ficha-ci.pdf
          head -c 4 /tmp/ficha-ci.pdf | grep -q "%PDF" && rm -f /tmp/ficha-ci.pdf
          curl -fsS "$URL/api/v1/pokedex/stats" -H "$AUTH" | jq -e 'has("total_pokemon")' >/dev/null
          echo "API desplegada y funcionando: http://192.168.1.245:$PUERTO/docs"
      - name: Logs del contenedor si algo falla
        if: failure()
        run: docker logs --tail 100 "$CONTENEDOR" || true
      - name: Borrar imágenes sin usar
        if: always()
        run: docker image prune -f

  # Despliegue público en Render (extra del enunciado): solo cuando cambia main y
  # después de los tests. Llama al deploy hook de Render, guardado como secreto del
  # repo (RENDER_DEPLOY_HOOK_URL), espera a que Render sirva este commit y lanza la
  # prueba de humo (scripts/prueba_humo.py). Sin el secreto, el trabajo no hace nada.
  deploy-render:
    needs: tests
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-render
      cancel-in-progress: false
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      URL: https://pokedex-api-wrok.onrender.com
    steps:
      - name: Lanzar despliegue en Render
        id: hook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::Sin el secreto RENDER_DEPLOY_HOOK_URL: no se despliega en Render."
            echo "lanzado=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "lanzado=true" >> "$GITHUB_OUTPUT"
          echo "Despliegue lanzado en Render."
      - name: Esperar a que Render sirva este commit
        if: steps.hook.outputs.lanzado == 'true'
        run: |
          # Render sigue sirviendo la versión anterior hasta que la nueva pasa su
          # health check. /health dice qué commit está sirviendo (RENDER_GIT_COMMIT).
          for i in $(seq 1 90); do
            commit=$(curl -fsS -m 60 "$URL/health" | jq -r '.commit // empty' || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then echo "Render ya sirve $GITHUB_SHA"; exit 0; fi
            echo "Esperando... Render sirve '${commit:-?}' (intento $i/90)"
            sleep 10
          done
          echo "::error::Render no ha desplegado $GITHUB_SHA en 15 minutos. Revisa los logs en Render."
          exit 1
      - uses: actions/checkout@v4
        if: steps.hook.outputs.lanzado == 'true'
      - uses: actions/setup-python@v5
        if: steps.hook.outputs.lanzado == 'true'
        with:
          python-version: "3.12"
      - name: Prueba de humo de la API desplegada
        if: steps.hook.outputs.lanzado == 'true'
        run: |
          pip install httpx
          python scripts/prueba_humo.py "$URL"
